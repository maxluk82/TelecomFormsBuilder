<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMHK · 登入 / Sign in</title><link rel="stylesheet" href="/login.css"></head><body><main><div class="brand">CMHK · 表格工作台</div><h1>授權用戶登入<span>Approved users only</span></h1><p>請使用管理員已批准的個人電郵或手機號碼。<br>Use the email address or mobile number approved by your administrator.</p><form id="login"><label>登入方式 / Sign-in method<select id="method"><option value="email">電郵驗證碼 / Email code</option><option value="sms" id="sms-option" hidden disabled>短訊驗證碼 / SMS code</option></select></label><label><span id="identity-label">電郵 / Email</span><input id="identity" type="email" autocomplete="email" required maxlength="254"></label><button type="button" id="send">發送驗證碼 / Send code</button><label>驗證碼 / Verification code<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required></label><button type="submit" class="primary">登入 / Sign in</button><p id="message" role="status" aria-live="polite"></p></form><p class="note">沒有公開註冊。請聯絡管理員申請使用權。<br>No public registration. Contact your administrator for access.</p></main><script src="/login.js"></script></body></html>
